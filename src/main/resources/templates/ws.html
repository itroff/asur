<!DOCTYPE html>
<html>
<head>
    <title>Hello WebSocket</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/sockjs-client/sockjs.min.js}"></script>
    <script th:src="@{/webjars/stomp-websocket/stomp.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</head>
<body>
<noscript><h2 style="color: #ff0000">Seems your browser doesn't support Javascript! Websocket relies on Javascript being
    enabled. Please enable
    Javascript and reload this page!</h2></noscript>
<div id="main-content" class="container">
    <div class="row">
        <div class="col-md-6">
            <form class="form-inline">
                <div class="form-group">
                    <label for="connect">WebSocket connection:</label>
                    <button id="connect" class="btn btn-default" type="submit">Connect</button>
                    <button id="disconnect" class="btn btn-default" type="submit" disabled="disabled">Disconnect
                    </button>
                </div>
            </form>
        </div>
        <div class="col-md-6">
            <form class="form-inline">
                <div class="form-group">
                    <label for="name">What is your name?</label>
                    <input type="text" id="name" class="form-control" placeholder="Your name here...">
                </div>
                <button id="send" class="btn btn-default" type="submit">Send</button>
            </form>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <table id="conversation" class="table table-striped">
                <thead>
                <tr>
                    <th>Greetings</th>
                </tr>
                </thead>
                <tbody id="greetings">
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>



<div>
    <h2>Robotics management system main page</h2>
    <div class="container-fluid">
      <div class="row main-row">
        <div class="col-xl-9">
          <div class="card">
            <div class="card-header">
              Robots in System
            </div>
            <div class="card-body">
              <table class="table table-hover table-bordered">
                <thead>
                  <tr>
                    <th scope="col">#</th>
                    <th scope="col">Robot name</th>
                    <th scope="col">Go to Control</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="robot: ${robots}">
                    <div th:switch="${robot.status}">
                      <span th:case="${T(com.asur.asur.models.RobotStatusEnum).ONLINE}">
                        <td th:text="${robot.id}" class="table-success" />
                        <td th:text="${robot.name}" class="table-success" />
                        <td class="table-success"><a class="btn btn-primary" th:href="@{/robot(id=${robot.id})}"
                            role="button">Go to robot control</a>
                        </td>
                      </span>
                      <span th:case="${T(com.asur.asur.models.RobotStatusEnum).FAULT}">
                        <td th:text="${robot.id}" class="table-danger" />
                        <td th:text="${robot.name}" class="table-danger" />
                        <td class="table-danger"><a class="btn btn-primary" th:href="@{/robot(id=${robot.id})}"
                            role="button">Go to robot control</a>
                        </td>
                      </span>
                      <span th:case="${T(com.asur.asur.models.RobotStatusEnum).NO_LINK}">
                        <td th:text="${robot.id}" class="table-secondary" />
                        <td th:text="${robot.name}" class="table-secondary" />
                        <td class="table-secondary"><a class="btn btn-primary" th:href="@{/robot(id=${robot.id})}"
                            role="button">Go to robot control</a>
                        </td>
                      </span>
                      </td>
                    </div>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-xl-3">
          <div class="card">
            <div class="card-header">
              Emergency Stop
            </div>
            <div class="card-body">
              <a href="/robots/stop" class="btn btn-danger btn-lg stop-button">Stop <br>robots!</a>
            </div>
          </div>
        </div>
      </div>
      <div class="row main-row">
        <div class="col-xl-12">
        <div class="card">
          <div class="card-header">
            Working with Scenarios
          </div>
          <div class="card-body">
            <h5 class="card-title">Upload scenario file</h5>
            <p class="card-text">After upload valid scenario file page will be refresh</p>
            <form action="/uploadScenario">
              <div class="mb-3">
                <label for="formFileLg" class="form-label">Scenario file:</label>
                <input class="form-control form-control-lg" id="formFileLg" type="file">
              </div>
            <button type="submit" class="btn btn-primary">Upload file</button>
          </form>
          </div>
        </div>
      </div>
      </div>
    </div>
  </div>
