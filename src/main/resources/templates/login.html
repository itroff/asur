<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
    <head>
        <title>АСУР вход в систему</title>
        <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
        <script type="text/javascript" th:src="@{/js/bootstrap.bundle.min.js}"></script>
    </head>
    <body>

        <section class="vh-100" style="background-color: #508bfc;">
            <div class="container py-5 h-100">
              <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                  <div class="card shadow-2-strong" style="border-radius: 1rem;">
                    <div class="card-body p-5 text-center">
          
                      <h3 class="mb-5">Войти в АСУР</h3>
                      <form th:action="@{/login}" method="post">
                      <div class="form-outline mb-4">
                        <input type="text" name="username" class="form-control form-control-lg" />
                        <label class="form-label" for="typeUsernameX-2">Логин</label>
                      </div>
          
                      <div class="form-outline mb-4">
                        <input type="password" name="password" class="form-control form-control-lg" />
                        <label class="form-label" for="typePasswordX-2">Пароль</label>
                      </div>
          
                      <!-- Checkbox -->
                      <div class="form-check d-flex justify-content-start mb-4">
                        <input class="form-check-input" type="checkbox" value="" id="form1Example3" />
                        <label class="form-check-label" for="form1Example3"> Запомнить пароль </label>
                      </div>
          
                      <button class="btn btn-primary btn-lg btn-block" type="submit">Войти</button>
          
                      <hr class="my-4">
                      <div th:if="${param.error}">
                        Неправильный логин или пароль.
                    </div>
                    <div th:if="${param.logout}">
                        Вы успешно вышли.
                    </div>
            </form>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
       
    </body>
</html>
