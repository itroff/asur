<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Main page of RMS</title>
  <meta charset="utf-8">
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <script type="text/javascript" th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
  <script th:src="@{/webjars/sockjs-client/sockjs.min.js}"></script>
  <script th:src="@{/webjars/stomp-websocket/stomp.min.js}"></script>
  <script th:src="@{/js/app.js}"></script>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-danger bg-danger">
    <span class="logo-dev"> <img class="logo-dev" th:src="@{/img/logo.png}" /></span>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <div class="dropdown">
          <button class="btn btn-danger dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="true">
            <span th:text="${username}"></span>
          </button>
          <ul class="dropdown-menu">
            <li> <a class="dropdown-item" href="/logout">Logout</a></li>
          </ul>

        </div>
        </div>
      </li>
    </ul>

  </nav>
  <nav class="nav">
    <a class="btn btn-dark but-pad" href="/index" role="button">System</a>
    <button class="btn btn-secondary but-pad">Shuttle</button>
    <a class="btn btn-secondary but-pad" href="/diagnostics" role="button">Monitor</a>
    <label class="ms-auto lbl-pad">Shuttle ID</label>
    <div class="form-group col-md-1">
      <select class="form-select select-pad" id="exampleFormControlSelect1">
        <option>No active</option>
      </select>
      
    </div>
    <span id="robot-status" class="dot dot-grey"></span>
    <button class="btn btn-success btn-sm but-pad">Operating Mode</button>
    <button class="btn btn-secondary btn-sm but-pad">Setting Mode</button>
  </nav>

  <div class="container-fluid text-center">
    <div class="row">
      <div class="col-4">
        <div class="header-area">
          Shuttle Auto Control
        </div>
        <div class="card card-main">
          <div class="card-body">
            <form action="/uploadScenario" class="form-left">
              <label for="inputPassword5" class="header-area">Path</label>
              <div class="row">
                <div class="col">
                  <input type="file" id="inputPassword5" class="form-control">
                </div>
                <div class="col">
                  <button type="submit" class="btn btn-primary">Load Scenario</button>
                </div>
              </div>
            </form>
            <div class="row">
              <div class="col">
                <div class="menuIcon">
                  <img th:src="@{/img/play.png}" />
                </div>
              </div>
              <div class="col">
                <div class="menuIcon">
                  <img th:src="@{/img/pause.png}" />
                </div>
              </div>
              <div class="col">
                <div class="menuIcon">
                  <img th:src="@{/img/cancel.png}" />
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="menuIcon" id="stop-btn">
          <img th:src="@{/img/stop.png}" />
        </div>
      </div>
      <div class="col-4">
        <div class="header-area">
          Shuttle Manual Control
        </div>
        <div class="card card-main">
          <div class="card-body">
            <div class="row">
              <div class="col-6">
                <div class="row">

                  <label for="position-input" class="form-label">Position #</label>
                  <div class="col-6">
                    <input type="text" class="form-control input-postion" readonly="readonly" id="position-input" value="1">
                  </div>
                  <div class="col-6">
                    <div class="row">
                      <button type="submit" class="btn btn-secondary btn-postition" id="arrow-up-btn"><i class="arrow up"></i></button>
                    </div>
                    <div class="row">
                      <button type="submit" class="btn btn-secondary btn-postition" id="arrow-down-btn"><i class="arrow down"></i></button>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-6">
                <div>
                  Move
                </div>
                <div class="menuIcon" id="move-up-btn">
                  <img th:src="@{/img/arrow_up.png}" />
                </div>
                <div class="menuIcon" id="move-down-btn">
                  <img th:src="@{/img/arrow_down.png}" />
                </div>
              </div>
            </div>
            <div class="row">
              <div>
                Load Cargo
              </div>
              <div class="col-6">
                <div class="menuIcon" id="load-right-btn">
                  <img th:src="@{/img/arrow_right.png}" />
                </div>
              </div>
              <div class="col-6">
                <div class="menuIcon" id="load-left-btn">
                  <img th:src="@{/img/arrow_left.png}" />
                </div>
              </div>
            </div>
            <div class="row">
              <div>
                Unload Cargo
              </div>
              <div class="col-6">
                <div class="menuIcon" id="unload-left-btn">
                  <img th:src="@{/img/arrow_left.png}" />
                </div>
              </div>
              <div class="col-6">
                <div class="menuIcon" id="unload-right-btn">
                  <img th:src="@{/img/arrow_right.png}" />
                </div>
              </div>
            </div>
            <div class="row">
              <div class="btn-start" id="start-pos-btn">
                <img th:src="@{/img/go_start.png}" />
              </div>
            </div>

          </div>

        </div>
    </div>
    <div class="col-4">
      <div class="header-area">
        Connected shuttles
      </div>
      <div class="card card-main connected">
        <div class="card-body">
          <ul id="list-connected">

          </ul>
        </div>
      </div>
      <div class="header-area">
        Connection Control
      </div>
      <div class="card card-main">
        <div class="card-body">

          <div class="row">
            <div class="col-8">
            <div class="header-area-no-margin">
              MQTT Broker
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text connected-span">IP:</span>
              <input type="text" class="form-control" id="mqtt-ip">
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text connected-span">PORT:</span>
              <input type="text" class="form-control" id="mqtt-port">
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text connected-span">ID:</span>
              <input type="text" class="form-control" id="mqtt-id">
            </div>
            
            </div>
            <div class="col-4">
              <button type="submit" class="btn btn-success btn-connected" id="mqtt-btn">Connected</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>

</body>

</html>
