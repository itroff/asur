<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Main page of RMS</title>
  <meta charset="utf-8">
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <script type="text/javascript" th:src="@{/js/bootstrap.bundle.min.js}"></script>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-danger bg-danger">
    <span class="logo-dev">  <img class="logo-dev" th:src="@{/img/logo.png}"/></span>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <div class="dropdown">
            <button class="btn btn-danger dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <span th:text="${username}"></span>
            </button>
            <ul class="dropdown-menu">
              <li> <a class="dropdown-item" href="/logout">Logout</a></li>
            </ul>
             
            </div>
          </div>
        </li>
      </ul>

  </nav>
  <nav class="nav">
    <button class="btn btn-dark but-pad">System</button>
    <button class="btn btn-secondary but-pad">Shuttle</button>
    <button class="btn btn-secondary but-pad">Monitor</button>
    <label class="ms-auto lbl-pad">Shuttle ID</label>
    <div class="form-group col-md-1">
      <select class="form-select select-pad" id="exampleFormControlSelect1" aria-label="Default select example">
        <option>001</option>
      </select>
    </div>
    <button class="btn btn-success btn-sm but-pad">Operating Mode</button>
    <button class="btn btn-secondary btn-sm but-pad">Setting Mode</button>

  </nav>

  <div>
    <h2>Robotics management system main page</h2>
    <div class="container-fluid">
      <div class="row main-row">
        <div class="col-xl-9">
          <div class="card">
            <div class="card-header">
              Robots in System
            </div>
            <div class="card-body">
              <table class="table table-hover table-bordered">
                <thead>
                  <tr>
                    <th scope="col">#</th>
                    <th scope="col">Robot name</th>
                    <th scope="col">Go to Control</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="robot: ${robots}">
                    <div th:switch="${robot.status}">
                      <span th:case="${T(com.asur.asur.models.RobotStatusEnum).ONLINE}">
                        <td th:text="${robot.id}" class="table-success" />
                        <td th:text="${robot.name}" class="table-success" />
                        <td class="table-success"><a class="btn btn-primary" th:href="@{/robot(id=${robot.id})}"
                            role="button">Go to robot control</a>
                        </td>
                      </span>
                      <span th:case="${T(com.asur.asur.models.RobotStatusEnum).FAULT}">
                        <td th:text="${robot.id}" class="table-danger" />
                        <td th:text="${robot.name}" class="table-danger" />
                        <td class="table-danger"><a class="btn btn-primary" th:href="@{/robot(id=${robot.id})}"
                            role="button">Go to robot control</a>
                        </td>
                      </span>
                      <span th:case="${T(com.asur.asur.models.RobotStatusEnum).NO_LINK}">
                        <td th:text="${robot.id}" class="table-secondary" />
                        <td th:text="${robot.name}" class="table-secondary" />
                        <td class="table-secondary"><a class="btn btn-primary" th:href="@{/robot(id=${robot.id})}"
                            role="button">Go to robot control</a>
                        </td>
                      </span>
                      </td>
                    </div>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-xl-3">
          <div class="card">
            <div class="card-header">
              Emergency Stop
            </div>
            <div class="card-body">
              <a href="/robots/stop" class="btn btn-danger btn-lg stop-button">Stop <br>robots!</a>
            </div>
          </div>
        </div>
      </div>
      <div class="row main-row">
        <div class="col-xl-12">
        <div class="card">
          <div class="card-header">
            Working with Scenarios
          </div>
          <div class="card-body">
            <h5 class="card-title">Upload scenario file</h5>
            <p class="card-text">After upload valid scenario file page will be refresh</p>
            <form action="/uploadScenario">
              <div class="mb-3">
                <label for="formFileLg" class="form-label">Scenario file:</label>
                <input class="form-control form-control-lg" id="formFileLg" type="file">
              </div>
            <button type="submit" class="btn btn-primary">Upload file</button>
          </form>
          </div>
        </div>
      </div>
      </div>
    </div>
  </div>

</body>

</html>
