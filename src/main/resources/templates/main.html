<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Main page of RMS</title>
  <meta charset="utf-8">
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <script type="text/javascript" th:src="@{/js/bootstrap.bundle.min.js}"></script>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-danger bg-danger">
    <span class="logo-dev"> <img class="logo-dev" th:src="@{/img/logo.png}" /></span>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <div class="dropdown">
          <button class="btn btn-danger dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <span th:text="${username}"></span>
          </button>
          <ul class="dropdown-menu">
            <li> <a class="dropdown-item" href="/logout">Logout</a></li>
          </ul>

        </div>
        </div>
      </li>
    </ul>

  </nav>
  <nav class="nav">
    <button class="btn btn-dark but-pad">System</button>
    <button class="btn btn-secondary but-pad">Shuttle</button>
    <button class="btn btn-secondary but-pad">Monitor</button>
    <label class="ms-auto lbl-pad">Shuttle ID</label>
    <div class="form-group col-md-1">
      <select class="form-select select-pad" id="exampleFormControlSelect1" aria-label="Default select example">
        <option>001</option>
      </select>
    </div>
    <button class="btn btn-success btn-sm but-pad">Operating Mode</button>
    <button class="btn btn-secondary btn-sm but-pad">Setting Mode</button>
  </nav>

  <div class="container text-center">
    <div class="row">
      <div class="col-4">
        <div class="header-area">
          Shuttle Auto Control
        </div>
        <div class="card">
          <div class="card-body">
            <form action="/uploadScenario" class="form-left">
              <label for="inputPassword5" class="header-area">Path</label>
              <div class="row">
                <div class="col">
                  <input type="file" id="inputPassword5" class="form-control">
                </div>
                <div class="col">
                  <button type="submit" class="btn btn-primary">Load Scenario</button>
                </div>
              </div>
            </form>
            <div class="row">
              <div class="col">
                <div class="menuIcon">
                  <img th:src="@{/img/play.png}" />
                </div>
              </div>
              <div class="col">
                <div class="menuIcon">
                  <img th:src="@{/img/pause.png}" />
                </div>
              </div>
              <div class="col">
                <div class="menuIcon">
                  <img th:src="@{/img/cancel.png}" />
                </div>
              </div>
            </div>
          </div>
        </div>
          <div class="menuIcon" id="menuIcon">
            <img th:src="@{/img/stop.png}" />
          </div>
        
      </div>
      <div class="col-4">
        <div class="header-area">
          Shuttle Manual Control
        </div>
        <div class="card">
          <div class="card-body">
            <label for="exampleFormControlInput1" class="form-label">Position #</label>
            <input type="text" class="form-control" id="exampleFormControlInput1">
            <button type="submit" class="btn btn-secondary"><i class="arrow up"></i></button>
            <button type="submit" class="btn btn-secondary"><i class="arrow down"></i></button>
            <div class="menuIcon">
              <img th:src="@{/img/arrow_up.png}" />
            </div>
          </div>
        </div>
      </div>
      <div class="col-4">
        <div class="header-area">
          Connected shuttles
        </div>
        <div class="card">
          <div class="card-body">
          </div>
        </div>
        <div class="header-area">
          Connection Control
        </div>
        <div class="card">
          <div class="card-body">
          </div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
