<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Robot control page</title>
  <meta charset="utf-8">
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <script type="text/javascript" th:src="@{/js/bootstrap.bundle.min.js}"></script>
</head>

<body>


  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand navbar-dark" href="#">
      <center>RMS</center>
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item active">
          <a class="nav-link" href="/index">Main page<span class="sr-only"></span></a>
        </li>
        <li th:if="${role} == 'admin'" class="nav-item">
          <a class="nav-link" href="/robot">Robot control center</a>
        </li>
        <li th:if="${role} == 'admin'" class="nav-item">
          <a class="nav-link" href="/diagnostics">Diagnostics</a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="/logout">Logout</a>
        </li>
      </ul>
    </div>
  </nav>
<div>
    <h2>Robot control page: <span th:text="${robot.name}"/> </h2>
    <div class="card">
        <div class="card-header">
          Move robot
        </div>
        <div class="card-body">
          <h5 class="card-title">Command for moving robot</h5>
          <form action="/sendCmd">
            <div class="mb-3">
                <label for="inputDistance" class="form-label">Distance</label>
                <input type="number" class="form-control" id="inputDistance">
            </div>
            <div class="form-check form-switch">
                <label class="form-check-label" for="flexSwitchCheckDefault">Back</label>
                <input class="form-check-input" type="checkbox" id="flexSwitchCheckDefault">
                <label class="form-check-label" for="flexSwitchCheckDefault">Forward</label>
              </div>
          <button type="submit" class="btn btn-primary">Send Command</button>
        </form>
        </div>
      </div>

      <div class="card main-row">
        <div class="card-header">
          Cargo command
        </div>
        <div class="card-body">
          <h5 class="card-title">Command for cargo open/close</h5>
          <form action="/sendCmd">
            <div class="mb-3">
                <label for="inputCargo" class="form-label">Cargo param</label>
                <input type="number" class="form-control" id="inputCargo">
            </div>
            <div class="form-check form-switch">
                <label class="form-check-label" for="switchCargo">Load</label>
                <input class="form-check-input" type="checkbox" id="switchCargo">
                <label class="form-check-label" for="switchCargo">Unload</label>
              </div>
          <button type="submit" class="btn btn-primary">Send Command</button>
        </form>
        </div>
      </div>
</div>


</body>

</html>
