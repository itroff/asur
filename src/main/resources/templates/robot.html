<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Robot control page</title>
  <meta charset="utf-8">
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <script type="text/javascript" th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
  <script th:src="@{/webjars/sockjs-client/sockjs.min.js}"></script>
  <script th:src="@{/webjars/stomp-websocket/stomp.min.js}"></script>
  <script th:src="@{/js/app-robots.js}"></script>
  <script th:src="@{/js/app-robot.js}"></script>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-danger bg-danger">
    <span class="logo-dev"> <img class="logo-dev" th:src="@{/img/logo.png}" /></span>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <div class="dropdown">
          <button class="btn btn-danger dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="true">
            <span th:text="${username}"></span>
          </button>
          <ul class="dropdown-menu">
            <li> <a class="dropdown-item" href="/logout">Logout</a></li>
          </ul>

        </div>
        </div>
      </li>
    </ul>

  </nav>
  <nav class="nav">
    <a class="btn btn-secondary but-pad" href="/index" role="button">System</a>
    <a class="btn btn-dark but-pad" href="/robot" role="button">Shuttle</a>
    <a class="btn btn-secondary but-pad" href="/diagnostics" role="button">Monitor</a>
    <label class="ms-auto lbl-pad">Shuttle ID</label>
    <div class="form-group col-md-1">
      <select class="form-select select-pad" id="exampleFormControlSelect1">
        <option>No active</option>
      </select>
      
    </div>
    <span id="robot-status" class="dot dot-grey"></span>
    <button class="btn btn-success btn-sm but-pad" id="operating-btn">Operating Mode</button>
    <button class="btn btn-secondary btn-sm but-pad" id="setting-btn">Setting Mode</button>
  </nav>

  <div class="container-fluid text-center">
    <div class="row">
      <div class="col-4">
        <div class="card card-main card-full">
          <div class="header-area-bold">
            Shuttle Configuration
          </div>
          <div class="card-body">
            <form>
              <div class="mb-3 row">
                <label for="maxSpeed" class="col-sm-6 col-form-label form-left">Maximum Shuttle Speed</label>
                <div class="col-sm-4">
                  <input type="text" class="form-control" id="maxSpeed">
                </div>
                <label for="maxSpeed" class="col-sm-2 col-form-label">m/s</label>
              </div>
              <div class="mb-3 row">
                <label for="lhdTime" class="col-sm-6 col-form-label form-left">LHD Time Extension</label>
                <div class="col-sm-4">
                  <input type="text" class="form-control" id="lhdTime">
                </div>
                <label for="maxSpeed" class="col-sm-2 col-form-label">s</label>
              </div>
              <div class="mb-3 row">
                <label for="fingerSpeed" class="col-sm-6 col-form-label form-left">Maximum Finger Speed</label>
                <div class="col-sm-4">
                  <input type="text" class="form-control" id="fingerSpeed">
                </div>
                <label for="maxSpeed" class="col-sm-2 col-form-label">%</label>
              </div>
              <div class="mb-3 row">
                <label for="lhdExtension" class="col-sm-6 col-form-label form-left">Maximum LHD Extension</label>
                <div class="col-sm-4">
                  <input type="text" class="form-control" id="lhdExtension">
                </div>
                <label for="maxSpeed" class="col-sm-2 col-form-label">mm</label>
              </div>
              <div class="row">
              <div class="col">
                <button type="submit" class="btn btn-primary but-pad">Read</button>
              </div>

              <div class="col">
                <button type="submit" class="btn btn-primary but-pad">Save</button>
              </div>
            </div>
            </form>
          </div>
        </div>
      </div>
      <div class="col-7">
        <div class="row">
          <div class="col-6">
            <div class="card card-main card-top">
              <div class="header-area-bold">
               Front left finger
              </div>
              <div class="card-body">

              </div>
            </div>
            <div class="card card-main card-top">
              <div class="header-area-bold">
               Rear left finger
              </div>
              <div class="card-body">

              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="card card-main card-top">
              <div class="header-area-bold">
               Front right finger
              </div>
              <div class="card-body">

              </div>
            </div>
            <div class="card card-main card-top">
              <div class="header-area-bold">
               Rear right finger
              </div>
              <div class="card-body">

              </div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="card card-main card-top">
            <div class="header-area-bold">
             Load Handling Device
            </div>
            <div class="card-body">

            </div>
          </div>
        </div>

      </div>
      <div class="col-1">
        <div class="card card-main card-top">
          <div class="header-area-bold">
           Platform
          </div>
          <div class="card-body">

          </div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
