version: '3'
services:
  main:
    container_name: asur
    image: asur
    network_mode: "host"
    restart: always
#    ports:
#      - "80:8080"
#      - "8666:8666"
    volumes:
      - $HOME/asur/:/asur/asur/src/main/resources/scenarious/:rw
    environment:
      - MQTT_ADDRESS=127.0.0.1
      - MQTT_ID=asur-server-prod